name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go Tests
        run: go test -v ./...

      - name: Compile Single Binary
        run: go build -o stackloom ./cmd/stackloom

      - name: Test Linter CLI
        run: ./stackloom lint -f testdata/microservices/docker-compose.yml --no-probe --exit-code=false
